<title>마인약품</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 고정 검색바 + 한 줄짜리 카드 목록. 오른쪽 숫자 칸에 코드(요율)를 크게 세워 훑어보기 쉽게 */
:root {
  --bg: #f3f5f4;
  --surface: #ffffff;
  --ink: #17211f;
  --muted: #5d6b68;
  --line: #dde3e1;
  --accent: #0b6b5f;
  --accent-soft: #e2f1ee;
  --up: #b4232f;
  --down: #1f5fae;
  --consign: #a8550a;
  --consign-soft: #fdf1e3;
  --font: "IBM Plex Sans KR", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101615; --surface: #18201f; --ink: #e6ecea; --muted: #94a3a0; --line: #2a3533;
    --accent: #4fc1b0; --accent-soft: #1b3330; --up: #f0777f; --down: #78a9ec;
    --consign: #f0b56e; --consign-soft: #3a2a18;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101615; --surface: #18201f; --ink: #e6ecea; --muted: #94a3a0; --line: #2a3533;
  --accent: #4fc1b0; --accent-soft: #1b3330; --up: #f0777f; --down: #78a9ec;
  --consign: #f0b56e; --consign-soft: #3a2a18;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
button, input, select { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); padding: 12px 16px 10px; border-bottom: 1px solid var(--line);
  display: grid; gap: 10px;
}
.titlebar { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.src { font-size: 12px; color: var(--muted); }
.tabs { display: flex; gap: 6px; }
.tab { flex: 1; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 0; font-size: 14px; font-weight: 500; cursor: pointer; }
.tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.searchrow { display: flex; gap: 6px; }
.search { position: relative; flex: 1; min-width: 0; }
#q { width: 100%; border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 36px 10px 12px; font-size: 16px; }
#q:focus { border-color: var(--accent); outline: none; }
#clear { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); border: 0; background: none; width: 32px; height: 32px; font-size: 18px; color: var(--muted); cursor: pointer; }
#co { flex: 0 0 6.5em; min-width: 0; border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 8px; font-size: 16px; }
#co:focus { border-color: var(--accent); outline: none; }
#sort { border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 0 8px; font-size: 14px; }
.meta { font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.meta b { color: var(--ink); font-variant-numeric: tabular-nums; }

main { padding: 12px 16px 32px; display: grid; gap: 8px; max-width: 720px; margin: 0 auto; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; display: grid; grid-template-columns: 1fr auto; column-gap: 12px; row-gap: 4px; }
.card .body { min-width: 0; display: grid; gap: 3px; }
.name { font-weight: 700; font-size: 16px; word-break: keep-all; overflow-wrap: anywhere; }
.co { font-size: 14px; color: var(--muted); }
.co .price { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }
.rate { text-align: right; align-self: start; min-width: 52px; }
.rate .n { display: block; font-size: 24px; font-weight: 700; line-height: 1.1; color: var(--accent); font-variant-numeric: tabular-nums; }
.rate .l { font-size: 11px; color: var(--muted); letter-spacing: 0.04em; }
.chips { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-top: 3px; font-size: 13px; }
.ing { border: 0; background: var(--accent-soft); color: var(--accent); border-radius: 6px; padding: 2px 8px; cursor: pointer; text-align: left; overflow-wrap: anywhere; }
.tag { color: var(--muted); padding: 2px 0; }
.mfg { border-radius: 6px; padding: 2px 8px; font-weight: 500; }
.mfg.self { background: var(--accent-soft); color: var(--accent); }
.mfg.consigned { background: var(--consign-soft); color: var(--consign); }
.mfg.unknown { color: var(--muted); border: 1px dashed var(--line); }
.more { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 12px; font-weight: 500; cursor: pointer; }
.empty { text-align: center; color: var(--muted); padding: 40px 0; }

h2 { font-size: 15px; margin: 14px 0 2px; display: flex; justify-content: space-between; }
h2:first-child { margin-top: 0; }
h2 span { color: var(--muted); font-weight: 400; font-size: 13px; }
.chg { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; cursor: pointer; text-align: left; width: 100%; }
.chg .body { min-width: 0; }
.chg .vals { font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 15px; }
.chg .vals s { color: var(--muted); }
.chg .vals b.up { color: var(--up); }
.chg .vals b.down { color: var(--down); }
.cls { font-size: 12px; color: var(--muted); }
</style>

<header>
  <div class="titlebar">
    <h1>요율표 검색</h1>
    <span class="src" id="src"></span>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-search" aria-selected="true">전체 검색</button>
    <button class="tab" role="tab" id="tab-month" aria-selected="false"></button>
  </div>
  <div class="searchrow" id="searchrow">
    <div class="search">
      <input id="q" type="search" inputmode="search" autocomplete="off" placeholder="성분·품목·제약사·대조약·보험코드">
      <button id="clear" aria-label="검색어 지우기" hidden>×</button>
    </div>
    <input id="co" type="search" autocomplete="off" placeholder="제약사" aria-label="제약사로 거르기">
    <select id="sort" aria-label="정렬">
      <option value="base">기본순</option>
      <option value="rate">코드↓</option>
      <option value="price">약가↓</option>
    </select>
  </div>
  <div class="meta" id="meta"></div>
</header>
<main id="list"></main>

<script>
const DATA = /*__DATA__*/null;
// 행 구조: [성분명, 코드, 제약사명, 제조형태, 품목명, 약가, 오리지날/대조약, 보험코드, 포장]
// 제조형태는 엑셀 D열이 아니라 보험코드로 Druginform DB에서 찾은 자체생산/위탁생산 값,
// 포장은 식약처 제품허가 API의 포장단위(의약품안전나라 '포장정보'와 같은 값) - 둘 다 build.py가 채움
const PAGE = 50;
const $ = (id) => document.getElementById(id);
const norm = (s) => String(s).toLowerCase().replace(/\s+/g, "");
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const won = (v) => (v === "" || v == null ? "" : Number(v).toLocaleString("ko-KR") + "원");

const rows = DATA.rows;
const coNorm = rows.map((r) => norm(r[2]));
const hay = rows.map((r) => norm([r[0], r[2], r[4], r[6], r[7]].join("|")));
const mon = (DATA.month.split(".")[1] || "").replace(/^0/, "");

$("src").textContent = DATA.source;
$("tab-month").textContent = (mon ? mon + "월" : "이달") + " 변동";

let state = { tab: "search", q: "", co: "", sort: "base", shown: PAGE };
try { Object.assign(state, JSON.parse(localStorage.getItem("rate-ui") || "{}"), { shown: PAGE }); } catch (e) {}
const save = () => { try { localStorage.setItem("rate-ui", JSON.stringify({ tab: state.tab, q: state.q, co: state.co, sort: state.sort })); } catch (e) {} };

function card(r, cls) {
  const [ing, rate, co, mfg, name, price, orig, ins, pack] = r;
  const mfgCls = !mfg ? "unknown" : mfg.startsWith("위탁") ? "consigned" : "self";
  return `<article class="card">
    <div class="body">
      ${cls ? `<div class="cls">${esc(cls)}</div>` : ""}
      <div class="name">${esc(name)}</div>
      <div class="co">${esc(co)}${price !== "" ? ` · <span class="price">${won(price)}</span>` : ""}</div>
      <div class="chips">
        ${ing ? `<button class="ing" data-q="${esc(ing)}">${esc(ing)}</button>` : ""}
        ${orig ? `<span class="tag">대조약 ${esc(orig)}</span>` : ""}
        <span class="mfg ${mfgCls}">${mfg ? esc(mfg) : "제조형태 확인불가"}</span>
        ${ins ? `<span class="tag">보험 ${esc(ins)}</span>` : ""}
        ${pack ? `<span class="tag">포장 ${esc(String(pack).replace(/\s*,\s*/g, ", "))}</span>` : ""}
      </div>
    </div>
    <div class="rate"><span class="l">코드</span><span class="n">${esc(rate)}</span></div>
  </article>`;
}

function filtered() {
  const terms = state.q.trim().split(/\s+/).map(norm).filter(Boolean);
  let idx = [];
  const co = norm(state.co);
  for (let i = 0; i < rows.length; i++) {
    if (terms.every((t) => hay[i].includes(t)) && (!co || coNorm[i].includes(co))) idx.push(i);
  }
  const num = (v) => (typeof v === "number" ? v : -1);
  if (state.sort === "rate") idx.sort((a, b) => num(rows[b][1]) - num(rows[a][1]));
  if (state.sort === "price") idx.sort((a, b) => num(rows[b][5]) - num(rows[a][5]));
  return idx;
}

function renderSearch() {
  const idx = filtered();
  $("meta").innerHTML = `<span><b>${idx.length.toLocaleString()}</b>건${state.q || state.co ? "" : ` (전체)`}</span><span>성분 칩을 누르면 같은 성분 비교</span>`;
  if (!idx.length) { $("list").innerHTML = `<p class="empty">“${esc([state.q, state.co].filter(Boolean).join(" · "))}”에 맞는 품목이 없습니다.<br>띄어쓰기를 바꾸거나 단어를 줄여 보세요.</p>`; return; }
  const html = idx.slice(0, state.shown).map((i) => card(rows[i])).join("");
  const rest = idx.length - state.shown;
  $("list").innerHTML = html + (rest > 0 ? `<button class="more" id="more">${Math.min(rest, PAGE)}건 더 보기 (남은 ${rest.toLocaleString()}건)</button>` : "");
}

const HEAD_MAP = { "성분명": 0, "코드": 1, "제약사명": 2, "생동/생산": 3, "품목명": 4, "약가": 5, "오리지날/대조약": 6, "보험코드": 7, "포장": 8 };
function renderMonth() {
  let out = "", total = 0;
  for (const s of DATA.special) {
    const h = s.header || [];
    total += s.rows.length;
    out += `<h2>${esc(s.title)}<span>${s.rows.length}건</span></h2>`;
    if (h.includes("변경 전")) {
      const isPrice = /약가/.test(s.title);
      out += s.rows.map((r) => {
        const o = Object.fromEntries(h.map((k, i) => [k, r[i]]));
        const a = o["변경 전"], b = o["변경 후"];
        const dir = b > a ? "up" : b < a ? "down" : "";
        const f = (v) => (isPrice ? Number(v).toLocaleString("ko-KR") : v);
        return `<button class="chg" data-q="${esc(o["품목명"])}"><span class="body"><span class="name">${esc(o["품목명"])}</span><br><span class="co">${esc(o["제약사명"])}</span></span><span class="vals"><s>${f(a)}</s> → <b class="${dir}">${f(b)}</b></span></button>`;
      }).join("");
    } else {
      out += s.rows.map((r) => {
        const row = Array(9).fill("");
        h.forEach((k, i) => { if (k in HEAD_MAP) row[HEAD_MAP[k]] = r[i]; });
        return card(row, r[h.indexOf("분류(A)")]);
      }).join("");
    }
  }
  $("meta").innerHTML = `<span><b>${total}</b>건 변동</span><span>요율·약가 변동 항목을 누르면 검색</span>`;
  $("list").innerHTML = out || `<p class="empty">이달 특이사항 시트가 없습니다.</p>`;
}

function render() {
  $("tab-search").setAttribute("aria-selected", state.tab === "search");
  $("tab-month").setAttribute("aria-selected", state.tab === "month");
  $("searchrow").hidden = state.tab !== "search";
  $("clear").hidden = !state.q;
  state.tab === "search" ? renderSearch() : renderMonth();
  save();
}

function search(q) {
  state.q = q; state.tab = "search"; state.shown = PAGE;
  $("q").value = q; render(); window.scrollTo(0, 0);
}

let timer;
$("co").addEventListener("input", (e) => { clearTimeout(timer); timer = setTimeout(() => { state.co = e.target.value; state.shown = PAGE; render(); }, 150); });
$("co").addEventListener("keydown", (e) => { if (e.key === "Enter") e.target.blur(); });
$("q").addEventListener("input", (e) => { clearTimeout(timer); timer = setTimeout(() => { state.q = e.target.value; state.shown = PAGE; render(); }, 150); });
$("q").addEventListener("keydown", (e) => { if (e.key === "Enter") e.target.blur(); });
$("clear").addEventListener("click", () => { search(""); $("q").focus(); });
$("sort").addEventListener("change", (e) => { state.sort = e.target.value; state.shown = PAGE; render(); });
$("tab-search").addEventListener("click", () => { state.tab = "search"; render(); });
$("tab-month").addEventListener("click", () => { state.tab = "month"; render(); window.scrollTo(0, 0); });
$("list").addEventListener("click", (e) => {
  const t = e.target.closest("[data-q], #more");
  if (!t) return;
  if (t.id === "more") { state.shown += PAGE; renderSearch(); return; }
  search(t.dataset.q);
});

$("q").value = state.q;
$("co").value = state.co;
$("sort").value = state.sort;
render();
</script>
